name: Security remediation target

# Reviewed public implementation. The schedule and master key live in a private
# caller repository, which pins both this workflow and security-sha to one commit.
on:
  workflow_call:
    inputs:
      target-repository:
        type: string
        required: true
      target-owner:
        type: string
        required: true
      target-name:
        type: string
        required: true
      default-branch:
        type: string
        required: true
      security-sha:
        description: Exact reviewed Morpheus Security commit
        type: string
        required: true
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: morpheus-security-${{ inputs.target-owner }}-${{ inputs.target-name }}
      cancel-in-progress: false
    steps:
      - name: Check out immutable orchestrator tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cpheinrich/morpheus-security
          ref: ${{ inputs.security-sha }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Require an immutable tooling revision
        env:
          SECURITY_SHA: ${{ inputs.security-sha }}
        run: |
          if ! printf '%s' "$SECURITY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "security-sha must be an exact 40-character commit" >&2
            exit 1
          fi
          test "$(git -C tooling rev-parse HEAD)" = "$SECURITY_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: tooling/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install and compile trusted tooling
        working-directory: tooling
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Isolate trusted tooling from target configuration
        run: mv tooling "$RUNNER_TEMP/morpheus-security-tooling"

      - name: Mint a target-repository bootstrap token
        id: bootstrap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.target-owner }}
          repositories: ${{ inputs.target-name }}
          permission-contents: read

      - name: Check out target default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.target-repository }}
          ref: ${{ inputs.default-branch }}
          path: target
          fetch-depth: 0
          token: ${{ steps.bootstrap-token.outputs.token }}
          persist-credentials: false

      - name: Prepare the target receipt directory
        run: mkdir -p target/.morpheus-security

      - name: Validate target identity and policy
        working-directory: target
        env:
          CONFIG_FILE: .github/morpheus-security.json
          TARGET_REPOSITORY: ${{ inputs.target-repository }}
          TARGET_OWNER: ${{ inputs.target-owner }}
          TARGET_NAME: ${{ inputs.target-name }}
        run: node "$RUNNER_TEMP/morpheus-security-tooling/scripts/token-scope.mjs"

      - name: Mint the least-privilege target token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.target-owner }}
          repositories: ${{ inputs.target-name }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: read
          permission-vulnerability-alerts: read

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Refresh and authenticate the live default branch
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          TARGET_REPOSITORY: ${{ inputs.target-repository }}
        run: |
          gh auth setup-git
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git checkout --detach "origin/$DEFAULT_BRANCH"
          LIVE_SHA="$(gh api "repos/$TARGET_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          test "$(git rev-parse HEAD)" = "$LIVE_SHA"
          test -f .github/morpheus-security.json

      - name: Revalidate the live opt-in policy
        working-directory: target
        env:
          CONFIG_FILE: .github/morpheus-security.json
          TARGET_REPOSITORY: ${{ inputs.target-repository }}
          TARGET_OWNER: ${{ inputs.target-owner }}
          TARGET_NAME: ${{ inputs.target-name }}
        run: node "$RUNNER_TEMP/morpheus-security-tooling/scripts/token-scope.mjs"

      - name: Reconcile existing bot pull requests
        id: reconcile
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SECURITY_CONFIG: .github/morpheus-security.json
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          TARGET_REPOSITORY: ${{ inputs.target-repository }}
        run: node "$RUNNER_TEMP/morpheus-security-tooling/scripts/security-remediation.mjs" reconcile

      - name: Require unchanged default-branch state before scanning
        if: steps.reconcile.outputs.merged != 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          TARGET_REPOSITORY: ${{ inputs.target-repository }}
        run: test "$(git rev-parse HEAD)" = "$(gh api "repos/$TARGET_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"

      - name: Scan trusted main with OSV
        if: steps.reconcile.outputs.merged != 'true'
        id: scan-before
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=json
            --output=target/.morpheus-security/before.json
            --recursive
            target/

      - name: Require a scanner result
        if: steps.reconcile.outputs.merged != 'true'
        run: test -s target/.morpheus-security/before.json

      - name: Prepare one non-conflicting dependency update
        if: steps.reconcile.outputs.merged != 'true'
        id: prepare
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCAN_FILE: .morpheus-security/before.json
          PLAN_FILE: .morpheus-security/plan.json
          SECURITY_CONFIG: .github/morpheus-security.json
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          TARGET_REPOSITORY: ${{ inputs.target-repository }}
        run: node "$RUNNER_TEMP/morpheus-security-tooling/scripts/security-remediation.mjs" prepare

      - name: Rescan candidate with OSV
        if: steps.reconcile.outputs.merged != 'true' && steps.prepare.outputs.changed == 'true'
        id: scan-after
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=json
            --output=target/.morpheus-security/after.json
            --recursive
            target/

      - name: Deliver candidate pull request
        if: steps.reconcile.outputs.merged != 'true' && steps.prepare.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PLAN_FILE: .morpheus-security/plan.json
          AFTER_SCAN_FILE: .morpheus-security/after.json
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          TARGET_REPOSITORY: ${{ inputs.target-repository }}
        run: node "$RUNNER_TEMP/morpheus-security-tooling/scripts/security-remediation.mjs" deliver

      - name: Upload the private run receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: morpheus-security-${{ inputs.target-owner }}-${{ inputs.target-name }}
          path: |
            target/.morpheus-security/before.json
            target/.morpheus-security/after.json
            target/.morpheus-security/plan.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
